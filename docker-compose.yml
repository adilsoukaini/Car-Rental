version: '3.8'

services:
  app:
    image: php:8.4-cli
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8099:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=car_rental_dev
      - DB_USERNAME=car_rental
      - DB_PASSWORD=password
    networks:
      - carrental

  # Queue worker — processes queued emails, push notifications, and other
  # ShouldQueue jobs. Without this, every async feature silently fails.
  worker:
    image: php:8.4-cli
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan queue:work --tries=3 --backoff=10,60,300 --sleep=3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=car_rental_dev
      - DB_USERNAME=car_rental
      - DB_PASSWORD=password
    restart: unless-stopped
    networks:
      - carrental

  # Scheduler — runs the bookings:release-expired-holds command every minute
  # plus any other scheduled tasks. Required for hold expiry cleanup.
  scheduler:
    image: php:8.4-cli
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=car_rental_dev
      - DB_USERNAME=car_rental
      - DB_PASSWORD=password
    restart: unless-stopped
    networks:
      - carrental

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: car_rental_dev
      POSTGRES_USER: car_rental
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_rental -d car_rental_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carrental

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - carrental

  meilisearch:
    image: getmeili/meilisearch:v1.10
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: carrental-dev-key
    volumes:
      - meilidata:/meili_data
    networks:
      - carrental

volumes:
  pgdata:
  meilidata:

networks:
  carrental:
    driver: bridge
